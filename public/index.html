<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10b981" />
    <meta name="background-color" content="#0a0a0a" />

    <!-- SEO & Open Graph -->
    <title>Sama — Halal Music Streaming</title>
    <meta
      name="description"
      content="Sama is your halal music streaming app — Nasheeds, Quran recitations, and Islamic audio curated for the Muslim community."
    />
    <meta property="og:title" content="Sama — Halal Music Streaming" />
    <meta
      property="og:description"
      content="Stream nasheeds, Quran recitations, devotional and ambient Islamic audio. A clean, curated listening experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/icon.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />

    <!-- PWA Manifest (optional, Expo can generate) -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Critical CSS — dark loading screen matching app theme */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Splash / loading state */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background-color: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }

      #splash-logo svg {
        width: 36px;
        height: 36px;
        fill: white;
      }

      #splash-title {
        color: #f5f5f5;
        font-size: 32px;
        font-weight: 800;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.5px;
      }

      #splash-subtitle {
        color: #6b7280;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin-top: 6px;
      }

      /* Loading dots animation */
      #splash-loader {
        display: flex;
        gap: 6px;
        margin-top: 32px;
      }

      #splash-loader span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
        animation: bounce 1.2s infinite ease-in-out;
      }

      #splash-loader span:nth-child(2) { animation-delay: 0.15s; }
      #splash-loader span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a0a; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    </style>
  </head>
  <body>
    <!-- Splash screen shown while JS bundle loads -->
    <div id="splash-screen">
      <div id="splash-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <div id="splash-title">Sama</div>
      <div id="splash-subtitle">Your halal music experience</div>
      <div id="splash-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Remove splash screen once app mounts
      function hideSplash() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 300);
        }
      }
      // Auto-hide after bundle loads (fallback 5s timeout)
      window.addEventListener('load', function() {
        setTimeout(hideSplash, 500);
      });
      setTimeout(hideSplash, 5000);
    </script>
  </body>
</html>
